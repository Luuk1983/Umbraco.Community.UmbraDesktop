variables:
  # The configuration to build/publish the project in
  # Usually this is 'Release'
  configuration: 'Release'

  # What agent to use for the pipeline
  # See possible agents here: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/hosted?view=azure-devops&tabs=yaml#software
  image: 'ubuntu-latest'

  # The id of the feed where to publish the package to
  # The NuGet feed of ProudNerds is 32b755df-3146-4f30-922c-f77cac9a5b07
  internalNuGetFeedId: '32b755df-3146-4f30-922c-f77cac9a5b07'
  
  # Can be used to set a specific .NET version (like 9.x, or 8.0.x). Leave blank (recommended) for the latest version supported by the agent.
  # See all possible options the version property here: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/use-dotnet-v2?view=azure-pipelines#inputs
  dotNetVersion: ''

  # Overrides what projects to pack into NuGet packages. Leave empty for the default (recommended).
  # If left empty, the default is src/**/*.csproj
  packagesToPackOverride: ''

  # This variable gives you the option to run npm scripts on one or multiple folders in the repository. If no npm scripts need to be run, leave this variable empty.
  # The formatting of this variable is: folderPath1:script1,folderPath2:script2,folderPath3:script3
  # The folderPath is the relative folder from the repo root where the package.json is located, for instance: 'src/TestProject.Umbraco'
  # The script is the script name as defined in the package.json file, for instance: 'build'
  # A valid example is: 'src/TestProject.Umbraco:build,src/TestProject.Core:build'
  npmScriptsToRun: "src/Umbraco.Community.UmbraDesktop:build"

    # The test project(s) to run unit tests for. Leave empty to skip running unit tests.
  # Supports glob patterns, for instance: '**/*.UnitTests.csproj' or 'tests/**/*.csproj'
  unitTestProjects: ""

  # Folders to remove after npm build (relative to repo root), so they are not included in the NuGet package.
  # Useful for removing frontend source folders whose compiled output has already been written to wwwroot.
  # The formatting of this variable is: folderPath1,folderPath2
  # A valid example is: 'src/TestProject.Umbraco/backoffice'
  npmFoldersToRemove: "src/Umbraco.Community.UmbraDesktop/backoffice"
