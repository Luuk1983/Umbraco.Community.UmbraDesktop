name: Build UmbraDesktop packages
description: >
  Restores, tests, builds and packs every shipped package, then proves each one actually contains
  its frontend. The single definition of "what ships and how", shared by CI and by the release.

inputs:
  output:
    description: Directory the .nupkg and .snupkg files are written to.
    required: false
    default: ./artifacts

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # cache-dependency-path has to name every lock file: with one package.json per shipped
    # package, the default single-file lookup would key the cache on the host alone and hand the
    # add-ons a cache that has nothing to do with them.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          src/Umbraco.Community.UmbraDesktop/package-lock.json
          src/Umbraco.Community.UmbraDesktop.Services.Arcade/package-lock.json
          src/Umbraco.Community.UmbraDesktop.Entertainment/package-lock.json
          src/Umbraco.Community.UmbraDesktop.Accessories/package-lock.json

    # Safe to key on the lock files because RestorePackagesWithLockFile is on repo-wide
    # (src/Directory.Build.props), so every packages.lock.json is committed and exact. They
    # are named rather than globbed: a `**` glob would pull in the test instance's lock file, and
    # its floating "17.*" dependencies would then throw this cache away for a change to a project
    # that contributes nothing to either package.
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/Umbraco.Community.UmbraDesktop/packages.lock.json', 'src/Umbraco.Community.UmbraDesktop.Services.Arcade/packages.lock.json', 'src/Umbraco.Community.UmbraDesktop.Entertainment/packages.lock.json', 'src/Umbraco.Community.UmbraDesktop.Accessories/packages.lock.json', 'src/Umbraco.Community.UmbraDesktop.Tests/packages.lock.json', 'src/Umbraco.Community.UmbraDesktop.Accessories.Tests/packages.lock.json', 'src/Umbraco.Community.UmbraDesktop.Services.Arcade.Tests/packages.lock.json') }}
        restore-keys: nuget-${{ runner.os }}-

    # Per project rather than by solution, and deliberately. The solution also holds the test
    # instance, whose ten floating "17.*" dependencies (Umbraco itself plus every commercial
    # package the catalogue is exercised against) add ~120 packages and can float to a version
    # that no longer compiles. In a release that would fail the run after the tag is already
    # public, for a reason unrelated to anything being shipped. CI builds the whole solution in a
    # separate job instead, where that breakage is news rather than a blocked release.
    - name: Restore
      shell: bash
      run: |
        dotnet restore src/Umbraco.Community.UmbraDesktop/Umbraco.Community.UmbraDesktop.csproj
        dotnet restore src/Umbraco.Community.UmbraDesktop.Tests/Umbraco.Community.UmbraDesktop.Tests.csproj
        dotnet restore src/Umbraco.Community.UmbraDesktop.Services.Arcade/Umbraco.Community.UmbraDesktop.Services.Arcade.csproj
        dotnet restore src/Umbraco.Community.UmbraDesktop.Entertainment/Umbraco.Community.UmbraDesktop.Entertainment.csproj
        dotnet restore src/Umbraco.Community.UmbraDesktop.Accessories/Umbraco.Community.UmbraDesktop.Accessories.csproj
        dotnet restore src/Umbraco.Community.UmbraDesktop.Accessories.Tests/Umbraco.Community.UmbraDesktop.Accessories.Tests.csproj
        dotnet restore src/Umbraco.Community.UmbraDesktop.Services.Arcade.Tests/Umbraco.Community.UmbraDesktop.Services.Arcade.Tests.csproj

    - name: Install frontend dependencies
      shell: bash
      run: |
        (cd src/Umbraco.Community.UmbraDesktop && npm ci)
        (cd src/Umbraco.Community.UmbraDesktop.Services.Arcade && npm ci)
        (cd src/Umbraco.Community.UmbraDesktop.Entertainment && npm ci)
        (cd src/Umbraco.Community.UmbraDesktop.Accessories && npm ci)

    - name: Test frontend
      shell: bash
      run: |
        (cd src/Umbraco.Community.UmbraDesktop && npm test)
        (cd src/Umbraco.Community.UmbraDesktop.Services.Arcade && npm test)
        (cd src/Umbraco.Community.UmbraDesktop.Entertainment && npm test)
        (cd src/Umbraco.Community.UmbraDesktop.Accessories && npm test)

    # Must run before dotnet build/pack: wwwroot/App_Plugins is gitignored, so a clean checkout
    # would otherwise pack a package with no frontend in it at all.
    - name: Build frontend
      shell: bash
      run: |
        (cd src/Umbraco.Community.UmbraDesktop && npm run build)
        (cd src/Umbraco.Community.UmbraDesktop.Services.Arcade && npm run build)
        (cd src/Umbraco.Community.UmbraDesktop.Entertainment && npm run build)
        (cd src/Umbraco.Community.UmbraDesktop.Accessories && npm run build)

    - name: Build
      shell: bash
      run: |
        dotnet build src/Umbraco.Community.UmbraDesktop/ --configuration Release --no-restore
        dotnet build src/Umbraco.Community.UmbraDesktop.Services.Arcade/ --configuration Release --no-restore
        dotnet build src/Umbraco.Community.UmbraDesktop.Entertainment/ --configuration Release --no-restore
        dotnet build src/Umbraco.Community.UmbraDesktop.Accessories/ --configuration Release --no-restore

    # Named by project file, never by directory or solution: a path that matches no project makes
    # `dotnet test` report success while running nothing.
    - name: Test backend
      shell: bash
      run: |
        dotnet test src/Umbraco.Community.UmbraDesktop.Tests/Umbraco.Community.UmbraDesktop.Tests.csproj --configuration Release --no-restore
        dotnet test src/Umbraco.Community.UmbraDesktop.Accessories.Tests/Umbraco.Community.UmbraDesktop.Accessories.Tests.csproj --configuration Release --no-restore
        dotnet test src/Umbraco.Community.UmbraDesktop.Services.Arcade.Tests/Umbraco.Community.UmbraDesktop.Services.Arcade.Tests.csproj --configuration Release --no-restore

    # Every package, every release, changed or not: they share a version off one tag, and matching
    # versions are the compatibility answer instead of a matrix somebody has to maintain
    # (design D13, docs/design/2026-09-06-desktop-apps-design.md §8.3).
    - name: Pack
      shell: bash
      run: |
        dotnet pack src/Umbraco.Community.UmbraDesktop/ --configuration Release --no-build --output "${{ inputs.output }}"
        dotnet pack src/Umbraco.Community.UmbraDesktop.Services.Arcade/ --configuration Release --no-build --output "${{ inputs.output }}"
        dotnet pack src/Umbraco.Community.UmbraDesktop.Entertainment/ --configuration Release --no-build --output "${{ inputs.output }}"
        dotnet pack src/Umbraco.Community.UmbraDesktop.Accessories/ --configuration Release --no-build --output "${{ inputs.output }}"

    # A package that installs cleanly and does nothing is this repository's worst failure mode, and
    # it looks identical to success everywhere else. In the release workflow this is also the last
    # point at which an empty package is still recoverable: after the push it is not, because a
    # published version cannot be replaced, only unlisted and superseded.
    - name: Verify each package ships its frontend
      shell: bash
      run: |
        for pkg in "${{ inputs.output }}"/*.nupkg; do
          count=$(unzip -l "$pkg" | grep -c "staticwebassets/App_Plugins/" || true)
          echo "$pkg: $count static web assets"
          [ "$count" -gt 0 ] || { echo "::error::$pkg ships no frontend"; exit 1; }
        done

    # Every add-on has to require this release of the host, up to the last 17: "[<host version>,
    # 17.99999999.0]". NuGet packs a ProjectReference as a bare ">= version" with no ceiling, and the
    # bound comes from src/Directory.Build.targets, which hooks NuGet's private
    # `_GetProjectReferenceVersions`. An SDK update can rename or reshape that target without a word,
    # and the pack would carry on succeeding with an unbounded dependency. This is where that shows.
    # An add-on is every Umbraco.Community.UmbraDesktop.* package other than the host, so a new one is
    # checked without anyone remembering to list it here. The ceiling is read from the property the
    # target uses rather than typed a second time, and given the ".0" NuGet normalises a two-part
    # version to in a nuspec.
    - name: Verify each add-on's host dependency range
      shell: bash
      run: |
        out="${{ inputs.output }}"
        shopt -s nullglob
        hosts=("$out"/Umbraco.Community.UmbraDesktop.[0-9]*.nupkg)
        [ "${#hosts[@]}" -eq 1 ] || { echo "::error::expected exactly one host package in $out, found ${#hosts[@]}: ${hosts[*]}"; exit 1; }
        addons=()
        for pkg in "$out"/Umbraco.Community.UmbraDesktop.*.nupkg; do
          [ "$pkg" = "${hosts[0]}" ] || addons+=("$pkg")
        done
        [ "${#addons[@]}" -gt 0 ] || { echo "::error::no add-on packages in $out"; exit 1; }
        host_version=$(unzip -p "${hosts[0]}" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p')
        [ -n "$host_version" ] || { echo "::error::could not read the version from ${hosts[0]}"; exit 1; }
        ceiling=$(dotnet msbuild src/Umbraco.Community.UmbraDesktop/Umbraco.Community.UmbraDesktop.csproj -getProperty:UmbraDesktopUmbracoMajorCeiling)
        [[ "$ceiling" =~ ^[0-9]+\.[0-9]+$ ]] && ceiling="$ceiling.0"
        expected="[$host_version, $ceiling]"
        failed=0
        for pkg in "${addons[@]}"; do
          actual=$(unzip -p "$pkg" '*.nuspec' | sed -n 's:.*<dependency id="Umbraco.Community.UmbraDesktop" version="\([^"]*\)".*:\1:p')
          echo "$pkg: host dependency '$actual', expected '$expected'"
          [ "$actual" = "$expected" ] || { echo "::error::$pkg depends on the host as '$actual', expected '$expected'"; failed=1; }
        done
        # An add-on that depends on another add-on (Entertainment on the Arcade) gets the same bound
        # from the same target, so the same range is checked for it, against the Arcade package's own
        # version, which is the host's because all packages are versioned off one tag. A package that
        # does not depend on the Arcade has no such line, and is skipped. But if any package does
        # depend on it, the Arcade has to be in this pack output too: a release that ships a
        # dependent without the package it requires is uninstallable, so a missing Arcade fails here
        # rather than the check quietly passing over it.
        arcade_pkgs=("$out"/Umbraco.Community.UmbraDesktop.Services.Arcade.[0-9]*.nupkg)
        arcade_expected=""
        if [ "${#arcade_pkgs[@]}" -eq 1 ]; then
          arcade_version=$(unzip -p "${arcade_pkgs[0]}" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p')
          arcade_expected="[$arcade_version, $ceiling]"
        fi
        for pkg in "${addons[@]}"; do
          actual=$(unzip -p "$pkg" '*.nuspec' | sed -n 's:.*<dependency id="Umbraco.Community.UmbraDesktop.Services.Arcade" version="\([^"]*\)".*:\1:p')
          [ -n "$actual" ] || continue
          if [ -z "$arcade_expected" ]; then
            echo "::error::$pkg depends on the Arcade but the Arcade package is not in $out (found ${#arcade_pkgs[@]}); a release has to ship both"
            failed=1
            continue
          fi
          echo "$pkg: Arcade dependency '$actual', expected '$arcade_expected'"
          [ "$actual" = "$arcade_expected" ] || { echo "::error::$pkg depends on the Arcade as '$actual', expected '$arcade_expected'"; failed=1; }
        done
        exit "$failed"
