name: CI

# Every branch a change can land on, which is not only the trunk. This filter matches the **base**
# of a pull request, so a branch missing from it gets no checks at all rather than failing ones —
# and the omission is silent, because a pull request with nothing configured to run looks exactly
# like one whose checks have not started yet. It cost v17.1.0 a last-minute fix merged into
# `release/v17.1.0` unbuilt, with the publish workflow on the tag as the next thing to touch that
# code. The branch that ships was the one branch without CI.
#
# `main` is listed literally as well as under `**/main` on purpose. `**` is documented to match
# zero or more of any character, which leaves whether it matches an *empty* leading segment as an
# edge case of GitHub's glob, and whether the trunk gets built is not a thing to settle on a
# subtlety. `**/main` is for versioned trunks, should a major ever need one of its own again; Umbraco
# 17 and 18 are built from one tree instead (docs/design/2026-10-23-umbraco-18-upgrade-plan.md D1).
# `dev/**` is for long-running work such as `dev/v18` that takes pull requests of its own.
on:
  pull_request:
    branches:
      - main
      - '**/main'
      - 'dev/**'
      - 'release/**'
      - 'hotfix/**'

jobs:
  # What ships. Kept identical to the release by sharing one composite action, because the way this
  # goes wrong is a workflow that does not know about a package: the Entertainment add-on existed
  # for a full release cycle before either workflow built it.
  # Both Umbraco majors, so an 18 package that would not build or pack is news on the pull request,
  # well before publish.yml is asked to ship one.
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for MinVer

      - uses: ./.github/actions/build-packages
        with:
          umbraco-majors: '17 18'

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 7

  # Every frontend type-checked and tested against the Umbraco 18 backoffice, where the packages
  # job checks them against the 17 one their lock files hold. The bundle is shared, so code that
  # only one major can type-check, or that behaves differently on one, has to show up here.
  # The swap installs 18 *with* its peer dependencies: --legacy-peer-deps pruned UUI, rxjs and the
  # rest, and produced 160 phantom type errors and test modules that would not load. The host also
  # needs the client generator 18 peers on, or npm refuses the install.
  frontend-umbraco18:
    name: Frontend on Umbraco 18
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - Umbraco.Community.UmbraDesktop
          - Umbraco.Community.UmbraDesktop.Services.Arcade
          - Umbraco.Community.UmbraDesktop.Services.Media
          - Umbraco.Community.UmbraDesktop.Entertainment
          - Umbraco.Community.UmbraDesktop.Accessories
          - Umbraco.Community.UmbraDesktop.Media
    defaults:
      run:
        working-directory: src/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/${{ matrix.package }}/package-lock.json

      - name: Install, then swap in the Umbraco 18 backoffice
        run: |
          npm ci
          extra=""
          [ "${{ matrix.package }}" = "Umbraco.Community.UmbraDesktop" ] && extra="@hey-api/openapi-ts@^0.99"
          npm install --no-save @umbraco-cms/backoffice@18 $extra

      - name: Type-check against 18
        run: npx tsc --noEmit -p backoffice

      - name: Test against 18
        run: npm test

  # Everything else: the test instances and the C# test projects, built as a solution, once per
  # Umbraco major. A separate job on purpose, and never merged into the packages job. The test
  # instances float their dependencies (Umbraco itself plus every commercial package the catalogue
  # is exercised against), so they can break without anyone touching them. Here that is news on a
  # pull request; in the release workflow it would be a blocked release for a reason unrelated to
  # anything being shipped. Running in parallel means it costs no wall-clock against the job that
  # matters.
  # One solution per major because the major is read from the solution's name: inside
  # Umbraco.Community.UmbraDesktop.app.v18.slnx every project builds as 18 (src/Directory.Build.props).
  solution:
    name: Solution (${{ matrix.solution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - Umbraco.Community.UmbraDesktop.app.slnx
          - Umbraco.Community.UmbraDesktop.app.v18.slnx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/Umbraco.Community.UmbraDesktop/package-lock.json
            src/Umbraco.Community.UmbraDesktop.Services.Arcade/package-lock.json
            src/Umbraco.Community.UmbraDesktop.Services.Media/package-lock.json
            src/Umbraco.Community.UmbraDesktop.Entertainment/package-lock.json
            src/Umbraco.Community.UmbraDesktop.Accessories/package-lock.json
            src/Umbraco.Community.UmbraDesktop.Media/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-solution-${{ runner.os }}-${{ matrix.solution }}-${{ hashFiles('**/packages*.lock.json') }}
          restore-keys: nuget-solution-${{ runner.os }}-${{ matrix.solution }}-

      # The Razor SDK discovers wwwroot/App_Plugins as static web assets, and it is gitignored
      # Vite output, so a clean checkout has to build the frontends before MSBuild sees them —
      # true for a plain build, not only for a pack.
      - name: Build frontends
        run: |
          (cd src/Umbraco.Community.UmbraDesktop && npm ci && npm run build)
          (cd src/Umbraco.Community.UmbraDesktop.Services.Arcade && npm ci && npm run build)
          (cd src/Umbraco.Community.UmbraDesktop.Services.Media && npm ci && npm run build)
          (cd src/Umbraco.Community.UmbraDesktop.Entertainment && npm ci && npm run build)
          (cd src/Umbraco.Community.UmbraDesktop.Accessories && npm ci && npm run build)
          (cd src/Umbraco.Community.UmbraDesktop.Media && npm ci && npm run build)

      - name: Build solution
        run: dotnet build ${{ matrix.solution }} --configuration Release
