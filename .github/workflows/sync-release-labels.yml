name: Sync release labels

# GitHub never copies labels between a pull request and the issues it closes, and the two drift:
# 17.4.0's #115 shipped through #134, which had `release/v17.4.0` while the issue did not, so the
# issue was missing when the release was filtered by label. When a pull request merges, this copies
# both ways between it and every issue it closes in this repository:
#
# - `release/*` from the pull request to the issue, so labelling either one when the version is
#   known keeps the issue filter complete. The issue is the place releases are filtered.
# - `bug`, `enhancement` or `documentation` from the issue to the pull request, but only when the
#   pull request has none of them, so `.github/release.yml` can sort the generated notes without
#   labelling the same change twice.
#
# Only linked issues count: "Closes #123" in the body or the Development sidebar. A mention of the
# number in the text is not a link, which is the other half of how #115 was missed.
#
# `pull_request_target` rather than `pull_request` so a fork's pull request gets a token that may
# write labels. That is safe here because nothing is checked out or run from the pull request: the
# job reads label names through the API and writes label names back.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  sync:
    # `labeled` as well as `closed`, so a version added after the merge still reaches the issue.
    # A pull request closed without merging shipped nothing and is left alone.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            /** The labels that sort a change in the release notes, in the order release.yml lists them. */
            const typeLabels = ['enhancement', 'bug', 'documentation'];
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prLabels = pr.labels.map((label) => label.name);

            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 50) {
                      nodes {
                        number
                        repository { nameWithOwner }
                        labels(first: 100) { nodes { name } }
                      }
                    }
                  }
                }
              }`, { owner, repo, number: pr.number });

            // An issue in another repository can be linked too, but its labels are not ours to set.
            const issues = result.repository.pullRequest.closingIssuesReferences.nodes
              .filter((issue) => issue.repository.nameWithOwner === `${owner}/${repo}`);
            if (issues.length === 0) {
              core.info(`#${pr.number} closes no issue in this repository; nothing to sync.`);
              return;
            }

            const releaseLabels = prLabels.filter((name) => name.startsWith('release/'));
            const typesFromIssues = new Set();
            for (const issue of issues) {
              const issueLabels = issue.labels.nodes.map((label) => label.name);
              const missing = releaseLabels.filter((name) => !issueLabels.includes(name));
              if (missing.length > 0) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: missing });
                core.info(`#${issue.number}: added ${missing.join(', ')}`);
              }
              for (const name of issueLabels) {
                if (typeLabels.includes(name)) typesFromIssues.add(name);
              }
            }

            // A type the author chose on the pull request wins over the issue's.
            if (!prLabels.some((name) => typeLabels.includes(name)) && typesFromIssues.size > 0) {
              const labels = [...typesFromIssues];
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels });
              core.info(`#${pr.number}: added ${labels.join(', ')}`);
            }
