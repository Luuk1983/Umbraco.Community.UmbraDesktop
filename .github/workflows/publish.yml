name: Publish to NuGet

on:
  push:
    tags: ['v*.*.*']

permissions:
  id-token: write # Required for NuGet trusted publishing
  contents: read # Required to check out the repository; nothing here writes to it

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for MinVer

      # The same composite action CI runs, so what is released is built exactly the way it was
      # tested on the pull request, and neither workflow can learn about a new package without the
      # other learning about it too.
      - uses: ./.github/actions/build-packages

      # The nuget.org trusted-publishing policy trusts this repository, this workflow file and the
      # production environment, with a `*` package glob. Renaming this file or dropping the
      # environment above breaks publishing until the policy is edited to match.
      - name: Login to NuGet (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Globs both packages, and pushes each .snupkg alongside its .nupkg automatically.
      # --skip-duplicate so a re-run after a partial failure pushes only what did not land.
      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # There is deliberately no GitHub release step. A tag push publishes to NuGet and nothing
      # else, so a version that is not worth announcing stays out of the repository's Releases
      # list. A release there is the owner's choice, made in the GitHub UI; see RELEASE.md.
